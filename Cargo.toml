[package]
name = "dawnflow"
version = "0.1.0"
edition = "2021"

[features]
default = ["nats"]
in_memory = []
in_memory_only = ["in_memory"]
nats=[ "dep:async-nats", "dep:serde_bytes", "dep:bytes", "dep:url", "dep:percent-encoding", "dep:rustls" ]
dawnjection = ["dep:dawnjection"]

[dependencies]
serde_bytes = { version = "0.11", optional = true }
async-trait = "0.1"
elegant-departure = { version = "0.3", features = ["tokio"] }
eyre = "0.6"
rmp-serde = "1.3.0"
serde = "1"
serde_json = "1.0.138"
thiserror = "2"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1"

async-nats = { version = "0.42", optional = true }
bytes = { version = "1", optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
# only used to pick ring as rustls crypto provider for TLS connections (see
# `src/nats/connection.rs`); same provider async-nats is built with
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
futures = "0.3.31"

# Optional dawnjection DI integration (see `src/dawnjection.rs`). Pinned by tag so
# dawnflow controls which dawnjection it integrates against; dawnjection itself no
# longer depends on dawnflow.
dawnjection = { git = "https://github.com/TheAngusMcFire/dawnjection.git", tag = "0.10.0", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3" }

[[example]]
name = "in_memory"
path = "examples/in_memory.rs"
required-features = ["in_memory_only"]

[[example]]
name = "nats"
path = "examples/nats.rs"
# todo change this
required-features = ["nats"]

[[example]]
name = "dawnjection"
path = "examples/dawnjection.rs"
required-features = ["dawnjection", "in_memory_only"]
